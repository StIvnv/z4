<style>
/* Работно място за проверка: лента с избор отгоре, три плочки с присъда, един широк чертеж, после таблиците. */
:root {
  --bg: #edf0f4; --surface: #ffffff; --surface-2: #f5f7fa; --ink: #17212d; --muted: #566375; --line: #d5dce6; --line-strong: #a9b5c4;
  --accent: #1f4e8c; --accent-ink: #ffffff; --accent-soft: #e3ebf6;
  --tens: #c0392b; --comp: #2f6db5; --tau: #1a7a3c; --kpt: #96307f; --sec: #d6dee9;
  --ok: #1b7443; --ok-soft: #e2f2e9; --bad: #b3261e; --bad-soft: #fbe6e4;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-data: "IBM Plex Mono", "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171e27; --surface-2: #1d2631; --ink: #e7ecf3; --muted: #9ba8b8; --line: #2b3643; --line-strong: #4a596d;
    --accent: #7fb0ee; --accent-ink: #0d1520; --accent-soft: #1b2a3f;
    --tens: #f08475; --comp: #73abf0; --tau: #5cc48a; --kpt: #e08fd2; --sec: #2b3746;
    --ok: #63cf93; --ok-soft: #16301f; --bad: #ff8a80; --bad-soft: #3a1c1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e27; --surface-2: #1d2631; --ink: #e7ecf3; --muted: #9ba8b8; --line: #2b3643; --line-strong: #4a596d;
  --accent: #7fb0ee; --accent-ink: #0d1520; --accent-soft: #1b2a3f;
  --tens: #f08475; --comp: #73abf0; --tau: #5cc48a; --kpt: #e08fd2; --sec: #2b3746;
  --ok: #63cf93; --ok-soft: #16301f; --bad: #ff8a80; --bad-soft: #3a1c1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1, h2 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 1.75rem; line-height: 1.15; }
h2 { font-size: 1.1rem; }
.eyebrow { margin: 0 0 4px; font-size: .75rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 68ch; }
sub { font-size: .72em; line-height: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.controls { padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px 18px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field > label, .field > .lbl { font-size: .82rem; color: var(--muted); font-weight: 500; }
select, input[type="text"] { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0; }
input[type="text"] { font-family: var(--font-data); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
select:focus-visible, input:focus-visible, button:focus-visible, .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
input[aria-invalid="true"] { border-color: var(--bad); }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; min-height: 40px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3px 4px; cursor: pointer; background: var(--surface-2); border-left: 1px solid var(--line-strong); font-weight: 600; line-height: 1.15; }
.seg label:first-of-type { border-left: 0; }
.seg label small { font-family: var(--font-data); font-weight: 400; font-size: .7rem; color: var(--muted); }
.seg input:checked + label { background: var(--accent); color: var(--accent-ink); }
.seg input:checked + label small { color: var(--accent-ink); }
.arow { display: flex; gap: 6px; align-items: stretch; flex-wrap: wrap; }
.arow input { flex: 1 1 96px; }
.arow .unit { display: flex; align-items: center; color: var(--muted); font-family: var(--font-data); }
button { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 10px; min-height: 40px; cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
button.step { width: 40px; font-family: var(--font-data); font-size: 1.1rem; padding: 0; }
button.reset { font-size: .82rem; min-height: 32px; padding: 4px 10px; margin-left: auto; }
.subrow { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.hint { font-size: .8rem; color: var(--muted); font-family: var(--font-data); min-height: 1.2em; }
.error { font-size: .8rem; color: var(--bad); }

.verdict { padding: 10px 14px; border-radius: var(--radius); border: 1px solid; font-size: .98rem; }
.verdict.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); }
.verdict.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile[data-ok="0"] { border-color: var(--bad); }
.tile-h { display: flex; align-items: center; gap: 8px; font-weight: 500; flex-wrap: wrap; }
.tile-h .pt { font-family: var(--font-data); font-size: .75rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 5px; }
.pill { margin-left: auto; font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad); color: var(--surface); }
.tile-v { display: flex; align-items: baseline; gap: 6px; }
.tile-v .num { font-family: var(--font-body); font-size: 2rem; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile-v .unit { color: var(--muted); font-size: .85rem; }
.bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--ok); }
.tile[data-ok="0"] .bar span { background: var(--bad); }
.tile-l { font-size: .8rem; color: var(--muted); }

.block { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.block > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.block > header p { margin: 0; font-size: .82rem; color: var(--muted); }
.meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 24px; margin: 0; }
.kv { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 10px; font-size: .9rem; min-width: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.scroll { overflow-x: auto; }
#diagram svg, #beam svg { display: block; width: 100%; min-width: 820px; height: auto; font-family: var(--font-body); }
#geom-sketch svg { display: block; width: 100%; height: auto; font-family: var(--font-body); }
.geom { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 12px 24px; align-items: start; }
.meta.one { grid-template-columns: minmax(0, 1fr); }
.meta.one .kv { grid-template-columns: 13.5rem minmax(0, 1fr); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: right; white-space: nowrap; }
thead th { background: var(--accent-soft); color: var(--ink); font-weight: 600; text-align: center; font-size: .8rem; }
td.c { text-align: center; }
td.lft { text-align: left; }
tr.neg td { color: var(--bad); }
tr.sum td { background: var(--surface-2); }
td.cnd { text-align: left; background: var(--surface-2); }
#sec-table td:first-child, #sec-table td.tags { text-align: left; }
tr.sel td { background: var(--accent-soft); }
.mut { color: var(--muted); }
.mark.ok { color: var(--ok); font-weight: 700; } .mark.bad { color: var(--bad); font-weight: 700; }
.tag { display: inline-block; font-family: var(--font-data); font-size: .72rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; padding: 0 5px; }
.tag.k { border-color: var(--kpt); color: var(--kpt); }
.note { font-size: .82rem; color: var(--muted); margin: 0; }
details { font-size: .88rem; }
details summary { cursor: pointer; font-weight: 600; font-family: var(--font-display); font-size: 1.05rem; }
details ul { margin: 8px 0 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 5px; max-width: 86ch; }

/* чертеж */
.d-sec { fill: var(--sec); stroke: var(--ink); stroke-width: .25; stroke-linejoin: round; }
.d-guide { stroke: var(--line-strong); stroke-width: .13; fill: none; }
.d-guide.axis { stroke-dasharray: 2.2 .7 .5 .7; stroke: var(--muted); }
.d-guide.kline { stroke-dasharray: .5 .5; stroke: var(--kpt); stroke-opacity: .7; }
.d-sep { stroke: var(--line); stroke-width: .15; }
.d-ax { stroke: var(--accent); stroke-width: .22; fill: none; }
.d-ax.hd { fill: var(--accent); stroke: none; }
.d-axdot { fill: var(--accent); }
.d-out { stroke: var(--ink); stroke-width: .25; fill: none; stroke-linejoin: round; }
.d-tens { fill: var(--tens); fill-opacity: .2; } .d-comp { fill: var(--comp); fill-opacity: .2; } .d-tau { fill: var(--tau); fill-opacity: .2; }
.d-k { stroke: var(--kpt); stroke-width: .38; }
.d-tmax { stroke: var(--tau); stroke-width: .42; }
.d-tarrow { stroke: var(--tau); stroke-width: .28; fill: none; }
.d-tarrow.hd { fill: var(--tau); stroke: none; }
#diagram text, #beam text, #geom-sketch text { font-size: 2.25px; fill: var(--ink); }
#diagram text.sm, #beam text.sm { font-size: 2px; }
#diagram text.b, #beam text.b, #geom-sketch text.b { font-weight: 600; }
#diagram text.it, #geom-sketch text.it { font-style: italic; }
#diagram text.d-h, #beam text.d-h { fill: var(--accent); font-weight: 600; font-size: 2.35px; }
#diagram text.d-mut, #beam text.d-mut { fill: var(--muted); }
#diagram text.d-axt, #beam text.d-axt, #geom-sketch text.d-axt { fill: var(--accent); }
#diagram text.d-tk, #beam text.d-tk { fill: var(--kpt); }
#diagram text.d-tt { fill: var(--tau); font-weight: 600; }
#diagram text.d-sign { font-size: 3.2px; font-weight: 600; }
#diagram text.d-sign.tens { fill: var(--tens); } #diagram text.d-sign.comp { fill: var(--comp); }
#diagram text.halo, #beam text.halo, #geom-sketch text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: .75px; stroke-linejoin: round; }
#diagram tspan.sb, #beam tspan.sb, #geom-sketch tspan.sb { font-size: 1.6px; }
#geom-sketch text { font-size: 2.6px; }
#geom-sketch tspan.sb { font-size: 1.9px; }
#beam text.d-rt { fill: var(--tau); font-weight: 600; }
#geom-sketch text.d-bad { fill: var(--bad); }
.d-beam { stroke: var(--ink); stroke-width: .9; stroke-linecap: butt; }
.d-wall { stroke: var(--ink); stroke-width: .8; }
.d-out.thin { stroke-width: .16; }
.d-sup { fill: var(--surface); stroke: var(--ink); stroke-width: .25; stroke-linejoin: round; }
.d-qblk { fill: var(--accent-soft); stroke: none; }
.d-load { stroke: var(--muted); stroke-width: .16; fill: none; }
.d-load.hd { fill: var(--muted); stroke: none; }
.d-force { stroke: var(--ink); stroke-width: .42; fill: none; }
.d-force.hd { fill: var(--ink); stroke: none; }
.d-reac { stroke: var(--tau); stroke-width: .42; fill: none; }
.d-reac.hd { fill: var(--tau); stroke: none; }
.d-dim { stroke: var(--muted); stroke-width: .16; fill: none; }
.d-dim.hd { fill: var(--muted); stroke: none; }
.d-nq { fill: var(--accent); fill-opacity: .16; }
.d-hole { fill: var(--surface); stroke: var(--bad); stroke-width: .25; stroke-dasharray: .9 .6; }
.d-guide.kx { stroke-dasharray: .7 .7; }
.d-guide.ext { stroke: var(--kpt); stroke-dasharray: .5 .5; }

@media (max-width: 860px) {
  .controls { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .controls .field.v { grid-column: 1 / -1; }
  .meta { grid-template-columns: minmax(0, 1fr); }
  .geom { grid-template-columns: minmax(0, 1fr); }
  .geom .sketch { max-width: 360px; }
}
@media (max-width: 620px) {
  .controls { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.45rem; }
  .kv, .meta.one .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
}
</style>
</head>

  <form class="panel controls" id="lock-form" autocomplete="off" hidden>

      </div>
      <span class="error" id="lock-error" hidden>Кодът не е верен. Проверете го и опитайте пак.</span>
    </div>
  </form>
</div>

  var $ = function (id) { return document.getElementById(id); };
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function norm(c) { return String(c || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function setFoot() { var f = $('foot'); if (f && window.__offlineReady) f.textContent = 'Запазено на устройството — работи и без интернет.'; }
  window.__setFoot = setFoot;
  async function unlock(code) {
    code = norm(code);
    if (!code) return false;
    try {
      var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.it, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

      $('app').innerHTML = obj.html; $('app').hidden = false; $('lock').hidden = true;
      obj.js.forEach(function (src) { var s = document.createElement('script'); s.textContent = src; document.body.appendChild(s); });
      try { localStorage.setItem('cw4-code', code); } catch (e) { /* без памет — кодът ще се иска при следващо отваряне */ }
      setFoot();
      return true;
    } catch (e) { return false; }
  }
  function showForm(msg) {
    $('lock-msg').textContent = msg;
    $('lock-form').hidden = false;
  }
  async function start() {
    if (!(window.crypto && crypto.subtle)) { $('lock-msg').textContent = 'Страницата се отваря само през адрес с https://.'; return; }
    var fromLink = '', saved = '';
    try { fromLink = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { fromLink = location.hash.replace(/^#/, ''); }
    try { saved = localStorage.getItem('cw4-code') || ''; } catch (e) { /* без памет */ }
    if (fromLink && await unlock(fromLink)) return;
    if (saved && await unlock(saved)) return;
    showForm(fromLink ? 'Кодът в линка не е верен. Въведете кода за достъп.' : 'Достъпът е с код. Отворете страницата с линка, който сте получили, или въведете кода тук.');
  }
  $('lock-form').addEventListener('submit', async function (e) {

    $('lock-error').hidden = true; $('lock-go').disabled = true;

    $('lock-go').disabled = false;
